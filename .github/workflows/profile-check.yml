name: Profile quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out public profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check script syntax
        run: |
          node --check scripts/check-profile.mjs
          node --check scripts/check-profile.test.mjs
      - name: Check structure, links and publication hygiene
        run: node scripts/check-profile.mjs
      - name: Test validation regressions
        run: node --test scripts/check-profile.test.mjs
      - name: Check whitespace
        run: git diff --check
